# App Name
spring.application.name=festivalProf

# Output Colorato nei Log di Spring Boot (ANSI Red per errori, Yellow per warning, Green per info)
spring.output.ansi.enabled=always

# Database Configuration (PostgreSQL by default)
spring.datasource.url=jdbc:postgresql://localhost:5432/festivalProf
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Fallback (Se PostgreSQL non e in esecuzione, decommentare le 4 righe sottostanti):
# spring.datasource.url=jdbc:h2:mem:festivalprof;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Settings
server.port=8080
