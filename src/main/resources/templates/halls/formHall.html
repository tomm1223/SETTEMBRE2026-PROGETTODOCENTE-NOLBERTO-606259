<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Sala - FestivalProf</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: #111827; font-weight: 800;"
            th:text="${sala.id != null ? 'Modifica Sala' : 'Inserisci Nuova Sala'}">
            Nuova Sala
        </h2>

        <form th:action="${sala.id != null} ? @{/admin/halls/{id}/edit(id=${sala.id})} : @{/admin/halls/new}" method="POST">
            <div class="form-group">
                <label for="nome">Nome Sala</label>
                <input type="text" id="nome" th:field="${sala.nome}" class="form-control" placeholder="Es. Sala Grande Lido">
                <div class="error-msg" th:if="${#fields.hasErrors('sala.nome')}" th:errors="${sala.nome}"></div>
            </div>

            <div class="form-group">
                <label for="indirizzo">Indirizzo</label>
                <input type="text" id="indirizzo" th:field="${sala.indirizzo}" class="form-control" placeholder="Es. Lungomare Marconi 30, Venezia">
                <div class="error-msg" th:if="${#fields.hasErrors('sala.indirizzo')}" th:errors="${sala.indirizzo}"></div>
            </div>

            <div class="form-group">
                <label for="capienza">Capienza Spettatori</label>
                <input type="number" id="capienza" th:field="${sala.capienza}" class="form-control" placeholder="1000">
                <div class="error-msg" th:if="${#fields.hasErrors('sala.capienza')}" th:errors="${sala.capienza}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">Salva Sala</button>
        </form>
    </div>
</div>

</body>
</html>
