<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Regista - FestivalProf</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: #111827; font-weight: 800;"
            th:text="${regista.id != null ? 'Modifica Regista' : 'Inserisci Nuovo Regista'}">
            Nuovo Regista
        </h2>

        <form th:action="${regista.id != null} ? @{/admin/directors/{id}/edit(id=${regista.id})} : @{/admin/directors/new}" method="POST">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="${regista.nome}" class="form-control" placeholder="Christopher">
                <div class="error-msg" th:if="${#fields.hasErrors('regista.nome')}" th:errors="${regista.nome}"></div>
            </div>

            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" th:field="${regista.cognome}" class="form-control" placeholder="Nolan">
                <div class="error-msg" th:if="${#fields.hasErrors('regista.cognome')}" th:errors="${regista.cognome}"></div>
            </div>

            <div class="form-group">
                <label for="dataNascita">Data di Nascita</label>
                <input type="date" id="dataNascita" th:field="${regista.dataNascita}" class="form-control">
                <div class="error-msg" th:if="${#fields.hasErrors('regista.dataNascita')}" th:errors="${regista.dataNascita}"></div>
            </div>

            <div class="form-group">
                <label for="nazionalita">Nazionalità</label>
                <input type="text" id="nazionalita" th:field="${regista.nazionalita}" class="form-control" placeholder="Regno Unito">
                <div class="error-msg" th:if="${#fields.hasErrors('regista.nazionalita')}" th:errors="${regista.nazionalita}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">Salva Regista</button>
        </form>
    </div>
</div>

</body>
</html>
