<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${film.titolo + ' - FestivalProf'}">Dettaglio Film</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- Card Principale Dettagli Film -->
    <div style="background: white; border-radius: 12px; padding: 2.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; margin-bottom: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <span class="badge badge-blue" th:text="${film.genere}">Genere</span>
                <h1 class="page-title" style="margin-top: 8px;" th:text="${film.titolo}">Titolo Film</h1>
                <p style="color: #6b7280; font-size: 1.1rem; margin-top: 4px;">
                    Anno: <strong th:text="${film.anno}">2023</strong> | 
                    Durata: <strong th:text="${film.durata}">120</strong> minuti | 
                    Paese: <strong th:text="${film.paeseProduzione}">Stati Uniti</strong>
                </p>
            </div>

            <!-- Media Voti -->
            <div style="text-align: right; background: #fffbebf5; padding: 1rem 1.5rem; border-radius: 12px; border: 1px solid #fcd34d;">
                <div style="font-size: 2.2rem; font-weight: 900; color: #d97706;">★ <span th:text="${film.mediaVoti}">0.0</span></div>
                <div style="font-size: 0.85rem; color: #78350f; font-weight: 600;">Media Recensioni</div>
            </div>
        </div>

        <!-- Regista -->
        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #f3f4f6;">
            <h3 style="margin: 0 0 8px 0; color: #111827;">🎥 Regia</h3>
            <p th:if="${film.regista != null}" style="margin: 0; font-size: 1.05rem;">
                <a th:href="@{/directors/{id}(id=${film.regista.id})}" style="color: #d97706; font-weight: 700; text-decoration: none;" th:text="${film.regista.nomeCompleto}">Nome Regista</a>
                (<span th:text="${film.regista.nazionalita}">Nazionalità</span>)
            </p>
            <p th:unless="${film.regista != null}" style="color: #6b7280; margin: 0;">Nessun regista associato.</p>
        </div>

        <!-- Festival a cui partecipa -->
        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #f3f4f6;">
            <h3 style="margin: 0 0 10px 0; color: #111827;">🏆 Festival Partecipanti</h3>
            <div th:if="${film.festivals.isEmpty()}" style="color: #6b7280;">Questo film non partecipa attualmente a nessun festival.</div>
            <div th:unless="${film.festivals.isEmpty()}" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a th:each="fest : ${film.festivals}" th:href="@{/festivals/{id}(id=${fest.id})}" class="btn btn-outline" style="font-size: 0.9rem;">
                    🏆 <span th:text="${fest.nome + ' (' + fest.anno + ')'}">Festival</span>
                </a>
            </div>
        </div>

        <!-- Admin Controls -->
        <div th:if="${isAdmin}" style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #f3f4f6; display: flex; gap: 10px;">
            <a th:href="@{/admin/movies/{id}/edit(id=${film.id})}" class="btn btn-outline">✏️ Modifica Film</a>
            <form th:action="@{/admin/movies/{id}/delete(id=${film.id})}" method="POST" style="margin:0;" onsubmit="return confirm('Eliminare questo film?');">
                <button type="submit" class="btn btn-danger">🗑️ Elimina Film</button>
            </form>
        </div>
    </div>

    <!-- Contenitore Vuoto per il Componente React Recensioni -->
    <div id="react-reviews-root" th:attr="data-film-id=${film.id}"></div>

</div>

<!-- Script CDN React & Babel -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Componente React per le Recensioni del Film (Fetch API REST backend) -->
<script type="text/babel">
    /*<![CDATA[*/
    const { useState, useEffect } = React;

    function ReviewsWidget({ filmId }) {
        const [reviews, setReviews] = useState([]);
        const [loading, setLoading] = useState(true);
        const [titolo, setTitolo] = useState('');
        const [testo, setTesto] = useState('');
        const [voto, setVoto] = useState(5);
        const [hoverVoto, setHoverVoto] = useState(0);
        const [errorMessage, setErrorMessage] = useState(null);
        const [successMessage, setSuccessMessage] = useState(null);

        useEffect(() => {
            fetch(`/api/movies/${filmId}/reviews`)
                .then(res => res.json())
                .then(data => {
                    setReviews(data);
                    setLoading(false);
                })
                .catch(err => {
                    console.error("Errore caricamento recensioni:", err);
                    setLoading(false);
                });
        }, [filmId]);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setErrorMessage(null);
            setSuccessMessage(null);

            try {
                const response = await fetch(`/api/movies/${filmId}/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titolo, testo, voto })
                });

                if (response.ok) {
                    const newRev = await response.json();
                    setReviews([newRev, ...reviews]);
                    setTitolo('');
                    setTesto('');
                    setVoto(5);
                    setSuccessMessage("Recensione pubblicata con successo!");
                } else if (response.status === 401) {
                    setErrorMessage("Devi effettuare il login per poter lasciare una recensione.");
                } else {
                    const txt = await response.text();
                    setErrorMessage(txt);
                }
            } catch (err) {
                setErrorMessage("Errore di connessione al server.");
            }
        };

        return (
            <div style={{ background: '#ffffff', borderRadius: '12px', padding: '2rem', border: '1px solid #e5e7eb', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.05)' }}>
                <h2 style={{ marginTop: 0, color: '#111827', fontSize: '1.6rem', borderBottom: '2px solid #f3f4f6', paddingBottom: '0.8rem', marginBottom: '1.5rem' }}>
                    💬 Recensioni degli Spettatori ({reviews.length})
                </h2>

                {/* Form Inserimento Recensione in React */}
                <div style={{ background: '#f9fafb', padding: '1.5rem', borderRadius: '10px', border: '1px solid #e5e7eb', marginBottom: '2rem' }}>
                    <h3 style={{ marginTop: 0, fontSize: '1.2rem', color: '#1f2937' }}>✍️ Scrivi la tua recensione </h3>

                    {errorMessage && (
                        <div style={{ background: '#fee2e2', color: '#991b1b', padding: '0.8rem 1rem', borderRadius: '6px', marginBottom: '1rem', fontWeight: 'bold' }}>
                            ⚠️ {errorMessage}
                        </div>
                    )}

                    {successMessage && (
                        <div style={{ background: '#d1fae5', color: '#065f46', padding: '0.8rem 1rem', borderRadius: '6px', marginBottom: '1rem', fontWeight: 'bold' }}>
                            ✅ {successMessage}
                        </div>
                    )}

                    <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                        {/* Selettore Voto a Stelle Interattivo */}
                        <div>
                            <label style={{ display: 'block', fontWeight: '600', marginBottom: '0.3rem', color: '#374151' }}>Valutazione:</label>
                            <div style={{ display: 'flex', gap: '4px' }}>
                                {[1, 2, 3, 4, 5].map((star) => (
                                    <span
                                        key={star}
                                        onMouseEnter={() => setHoverVoto(star)}
                                        onMouseLeave={() => setHoverVoto(0)}
                                        onClick={() => setVoto(star)}
                                        style={{
                                            cursor: 'pointer',
                                            fontSize: '2rem',
                                            color: star <= (hoverVoto || voto) ? '#f59e0b' : '#d1d5db',
                                            transition: 'color 0.15s'
                                        }}
                                    >
                                        ★
                                    </span>
                                ))}
                            </div>
                        </div>

                        <div>
                            <input
                                type="text"
                                placeholder="Titolo della recensione (es. Capolavoro visivo!)"
                                value={titolo}
                                onChange={(e) => setTitolo(e.target.value)}
                                required
                                style={{ width: '100%', padding: '0.65rem', borderRadius: '6px', border: '1px solid #d1d5db', fontSize: '1rem' }}
                            />
                        </div>

                        <div>
                            <textarea
                                placeholder="Scrivi la tua opinione dettagliata sul film..."
                                value={testo}
                                onChange={(e) => setTesto(e.target.value)}
                                required
                                rows="3"
                                style={{ width: '100%', padding: '0.65rem', borderRadius: '6px', border: '1px solid #d1d5db', fontSize: '1rem', fontFamily: 'inherit' }}
                            ></textarea>
                        </div>

                        <button
                            type="submit"
                            style={{ backgroundColor: '#f59e0b', color: '#111827', padding: '0.75rem 1.5rem', border: 'none', borderRadius: '6px', fontWeight: 'bold', fontSize: '1rem', cursor: 'pointer', width: '220px' }}
                        >
                            Invia Recensione
                        </button>
                    </form>
                </div>

                {/* Elenco Recensioni Esistenti */}
                {loading ? (
                    <p style={{ color: '#6b7280' }}>Caricamento recensioni in corso...</p>
                ) : reviews.length === 0 ? (
                    <p style={{ color: '#6b7280', textAlign: 'center', padding: '1rem' }}>Non ci sono ancora recensioni per questo film. Sii il primo a recensirlo!</p>
                ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                        {reviews.map((rev) => (
                            <div key={rev.id} style={{ padding: '1.2rem', borderRadius: '8px', border: '1px solid #f3f4f6', backgroundColor: '#ffffff', boxShadow: '0 2px 4px rgba(0,0,0,0.02)' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.4rem' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                        <span style={{ fontWeight: 'bold', color: '#111827' }}>👤 {rev.autore}</span>
                                        <span style={{ color: '#f59e0b', fontSize: '1.1rem', letterSpacing: '2px' }}>
                                            {'★'.repeat(rev.voto)}{'☆'.repeat(5 - rev.voto)}
                                        </span>
                                    </div>
                                    <span style={{ fontSize: '0.85rem', color: '#9ca3af' }}>{rev.data}</span>
                                </div>
                                <h4 style={{ margin: '0 0 6px 0', fontSize: '1.1rem', color: '#1f2937' }}>{rev.titolo}</h4>
                                <p style={{ margin: 0, color: '#4b5563', lineHeight: '1.5' }}>{rev.testo}</p>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
    }

    const rootElement = document.getElementById('react-reviews-root');
    const filmId = rootElement.getAttribute('data-film-id');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<ReviewsWidget filmId={filmId} />);
    /*]]>*/
</script>

</body>
</html>
