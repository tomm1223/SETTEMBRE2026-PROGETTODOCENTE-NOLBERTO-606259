<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${film.titolo + ' - FestivalProf'}">Dettaglio Film</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- Card Principale Dettagli Film -->
    <div style="background: var(--bg-card); border-radius: 12px; padding: 2.8rem; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); margin-bottom: 2.2rem;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
            <div>
                <span class="badge badge-burgundy" th:text="${film.genere}">Genere</span>
                <h1 class="page-title" style="margin-top: 10px; font-size: 2.5rem;" th:text="${film.titolo}">Titolo Film</h1>
                <p style="color: var(--text-secondary); font-size: 1.05rem; margin-top: 6px; font-weight: 500;">
                    Anno: <strong style="color: var(--text-primary);" th:text="${film.anno}">2023</strong> &bull; 
                    Durata: <strong style="color: var(--text-primary);" th:text="${film.durata}">120</strong> minuti &bull; 
                    Paese: <strong style="color: var(--text-primary);" th:text="${film.paeseProduzione}">Stati Uniti</strong>
                </p>
            </div>

            <!-- Media Voti -->
            <div style="text-align: right; background: #fffbebf5; padding: 1.1rem 1.8rem; border-radius: 10px; border: 1px solid #fde68a;">
                <div style="font-size: 2.4rem; font-weight: 800; color: #b45309; line-height: 1;">★ <span th:text="${film.mediaVoti}">0.0</span></div>
                <div style="font-size: 0.8rem; color: #92400e; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px;">Valutazione Media</div>
            </div>
        </div>

        <!-- Regista -->
        <div style="margin-top: 2rem; padding-top: 1.8rem; border-top: 1px solid var(--border-subtle);">
            <h3 style="margin: 0 0 8px 0; font-size: 1.1rem;">Regia</h3>
            <p th:if="${film.regista != null}" style="margin: 0; font-size: 1.05rem;">
                <a th:href="@{/directors/{id}(id=${film.regista.id})}" style="color: var(--brand-burgundy); font-weight: 700; text-decoration: none;" th:text="${film.regista.nomeCompleto}">Nome Regista</a>
                <span style="color: var(--text-muted); font-size: 0.95rem;">(<span th:text="${film.regista.nazionalita}">Nazionalità</span>)</span>
            </p>
            <p th:unless="${film.regista != null}" style="color: var(--text-muted); margin: 0;">Nessun regista associato a questo film.</p>
        </div>

        <!-- Festival a cui partecipa -->
        <div style="margin-top: 1.8rem; padding-top: 1.8rem; border-top: 1px solid var(--border-subtle);">
            <h3 style="margin: 0 0 12px 0; font-size: 1.1rem;">Festival Partecipanti</h3>
            <div th:if="${film.festivals.isEmpty()}" style="color: var(--text-muted); font-size: 0.95rem;">Questo film non partecipa attualmente a nessun festival registrato.</div>
            <div th:unless="${film.festivals.isEmpty()}" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a th:each="fest : ${film.festivals}" th:href="@{/festivals/{id}(id=${fest.id})}" class="btn btn-outline" style="font-size: 0.88rem; padding: 0.4rem 0.9rem;">
                    <span th:text="${fest.nome + ' (' + fest.anno + ')'}">Festival</span>
                </a>
            </div>
        </div>

        <!-- Admin Controls -->
        <div th:if="${isAdmin}" style="margin-top: 2.2rem; padding-top: 1.8rem; border-top: 1px solid var(--border-subtle); display: flex; gap: 12px;">
            <a th:href="@{/admin/movies/{id}/edit(id=${film.id})}" class="btn btn-outline">Modifica Scheda</a>
            <form th:action="@{/admin/movies/{id}/delete(id=${film.id})}" method="POST" style="margin:0;" onsubmit="return confirm('Eliminare definitivamente questo film?');">
                <button type="submit" class="btn btn-danger">Elimina Film</button>
            </form>
        </div>
    </div>

    <!-- Contenitore per il Componente React Recensioni -->
    <div id="react-reviews-root" 
         th:attr="data-film-id=${film.id}, data-current-user=${userDetails != null ? userDetails.username : ''}, data-is-admin=${isAdmin}"></div>

</div>

<!-- Script CDN React & Babel -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Componente React per le Recensioni del Film (Fetch API REST backend) -->
<script type="text/babel">
    /*<![CDATA[*/
    const { useState, useEffect } = React;

    function ReviewsWidget({ filmId, currentUser, isAdmin }) {
        const [reviews, setReviews] = useState([]);
        const [loading, setLoading] = useState(true);
        const [titolo, setTitolo] = useState('');
        const [testo, setTesto] = useState('');
        const [voto, setVoto] = useState(5);
        const [hoverVoto, setHoverVoto] = useState(0);
        const [errorMessage, setErrorMessage] = useState(null);
        const [successMessage, setSuccessMessage] = useState(null);

        useEffect(() => {
            fetch(`/api/movies/${filmId}/reviews`)
                .then(res => res.json())
                .then(data => {
                    setReviews(data);
                    setLoading(false);
                })
                .catch(err => {
                    console.error("Errore caricamento recensioni:", err);
                    setLoading(false);
                });
        }, [filmId]);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setErrorMessage(null);
            setSuccessMessage(null);

            try {
                const response = await fetch(`/api/movies/${filmId}/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titolo, testo, voto })
                });

                if (response.ok) {
                    const newRev = await response.json();
                    setReviews([newRev, ...reviews]);
                    setTitolo('');
                    setTesto('');
                    setVoto(5);
                    setSuccessMessage("La tua recensione è stata pubblicata con successo.");
                } else if (response.status === 401) {
                    setErrorMessage("Devi effettuare l'accesso per poterti esprimere.");
                } else {
                    const txt = await response.text();
                    setErrorMessage(txt);
                }
            } catch (err) {
                setErrorMessage("Impossibile contattare il server.");
            }
        };

        return (
            <div style={{ background: 'var(--bg-card)', borderRadius: '12px', padding: '2.5rem', border: '1px solid var(--border-light)', boxShadow: 'var(--shadow-md)' }}>
                <h2 style={{ marginTop: 0, color: 'var(--text-primary)', fontSize: '1.6rem', borderBottom: '1px solid var(--border-light)', paddingBottom: '0.9rem', marginBottom: '1.8rem' }}>
                    Recensioni del Pubblico ({reviews.length})
                </h2>

                {/* Form Inserimento Recensione in React */}
                <div style={{ background: '#faf9f5', padding: '1.8rem', borderRadius: '10px', border: '1px solid var(--border-light)', marginBottom: '2.2rem' }}>
                    <h3 style={{ marginTop: 0, fontSize: '1.15rem', color: 'var(--text-primary)' }}>Scrivi la tua recensione</h3>

                    {errorMessage && (
                        <div style={{ background: '#fef2f2', color: '#991b1b', border: '1px solid #fecaca', padding: '0.8rem 1rem', borderRadius: '6px', marginBottom: '1.2rem', fontWeight: '600', fontSize: '0.9rem' }}>
                            {errorMessage}
                        </div>
                    )}

                    {successMessage && (
                        <div style={{ background: '#f0fdf4', color: '#166534', border: '1px solid #bbf7d0', padding: '0.8rem 1rem', borderRadius: '6px', marginBottom: '1.2rem', fontWeight: '600', fontSize: '0.9rem' }}>
                            {successMessage}
                        </div>
                    )}

                    <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.1rem' }}>
                        {/* Selettore Voto a Stelle Interattivo */}
                        <div>
                            <label style={{ display: 'block', fontWeight: '600', marginBottom: '0.35rem', color: 'var(--text-primary)', fontSize: '0.9rem' }}>Valutazione Spettatore:</label>
                            <div style={{ display: 'flex', gap: '6px' }}>
                                {[1, 2, 3, 4, 5].map((star) => (
                                    <span
                                        key={star}
                                        onMouseEnter={() => setHoverVoto(star)}
                                        onMouseLeave={() => setHoverVoto(0)}
                                        onClick={() => setVoto(star)}
                                        style={{
                                            cursor: 'pointer',
                                            fontSize: '1.8rem',
                                            color: star <= (hoverVoto || voto) ? '#b45309' : '#d4d4d8',
                                            transition: 'color 0.15s ease'
                                        }}
                                    >
                                        ★
                                    </span>
                                ))}
                            </div>
                        </div>

                        <div>
                            <input
                                type="text"
                                placeholder="Titolo sintetico della recensione..."
                                value={titolo}
                                onChange={(e) => setTitolo(e.target.value)}
                                required
                                style={{ width: '100%', padding: '0.7rem 0.9rem', borderRadius: '6px', border: '1px solid var(--border-light)', fontSize: '0.95rem', fontFamily: 'var(--font-body)', background: '#ffffff' }}
                            />
                        </div>

                        <div>
                            <textarea
                                placeholder="Esprimi la tua opinione sul film..."
                                value={testo}
                                onChange={(e) => setTesto(e.target.value)}
                                required
                                rows="4"
                                style={{ width: '100%', padding: '0.7rem 0.9rem', borderRadius: '6px', border: '1px solid var(--border-light)', fontSize: '0.95rem', fontFamily: 'var(--font-body)', background: '#ffffff' }}
                            ></textarea>
                        </div>

                        <button
                            type="submit"
                            style={{ backgroundColor: 'var(--brand-burgundy)', color: '#ffffff', padding: '0.75rem 1.6rem', border: 'none', borderRadius: '6px', fontWeight: '600', fontSize: '0.9rem', cursor: 'pointer', width: '220px' }}
                        >
                            Pubblica Recensione
                        </button>
                    </form>
                </div>

                {/* Elenco Recensioni Esistenti */}
                {loading ? (
                    <p style={{ color: 'var(--text-muted)' }}>Caricamento recensioni...</p>
                ) : reviews.length === 0 ? (
                    <p style={{ color: 'var(--text-muted)', textAlign: 'center', padding: '1.5rem' }}>Nessuna recensione pubblicata per questo film. Sii il primo a esprimerti!</p>
                ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.4rem' }}>
                        {reviews.map((rev) => {
                            const isAuthor = currentUser && rev.autore === currentUser;
                            const canDelete = isAuthor || isAdmin;

                            return (
                                <div key={rev.id} style={{ padding: '1.4rem', borderRadius: '8px', border: '1px solid var(--border-subtle)', backgroundColor: '#ffffff' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                            <span style={{ fontWeight: '700', color: 'var(--text-primary)', fontSize: '0.95rem' }}>{rev.autore}</span>
                                            <span style={{ color: '#b45309', fontSize: '1rem', letterSpacing: '2px' }}>
                                                {'★'.repeat(rev.voto)}{'☆'.repeat(5 - rev.voto)}
                                            </span>
                                        </div>
                                        <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{rev.data}</span>
                                    </div>
                                    <h4 style={{ margin: '0 0 6px 0', fontSize: '1.1rem', color: 'var(--text-primary)' }}>{rev.titolo}</h4>
                                    <p style={{ margin: 0, color: 'var(--text-secondary)', lineHeight: '1.5', fontSize: '0.94rem' }}>{rev.testo}</p>

                                    {/* Pulsanti Modifica / Elimina riservati all'autore o admin */}
                                    {canDelete && (
                                        <div style={{ marginTop: '0.8rem', paddingTop: '0.6rem', borderTop: '1px dashed var(--border-subtle)', display: 'flex', gap: '10px', justifyContent: 'flex-end' }}>
                                            {isAuthor && (
                                                <a href={`/recensioni/${rev.id}/edit`} className="btn btn-outline" style={{ padding: '3px 10px', fontSize: '0.78rem' }}>Modifica</a>
                                            )}
                                            <form action={`/recensioni/${rev.id}/delete`} method="POST" style={{ margin: 0 }} onSubmit={(e) => { if (!confirm('Eliminare questa recensione?')) e.preventDefault(); }}>
                                                <button type="submit" className="btn btn-danger" style={{ padding: '3px 10px', fontSize: '0.78rem' }}>Elimina</button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        );
    }

    const rootElement = document.getElementById('react-reviews-root');
    const filmId = rootElement.getAttribute('data-film-id');
    const currentUser = rootElement.getAttribute('data-current-user');
    const isAdmin = rootElement.getAttribute('data-is-admin') === 'true';
    const root = ReactDOM.createRoot(rootElement);
    root.render(<ReviewsWidget filmId={filmId} currentUser={currentUser} isAdmin={isAdmin} />);
    /*]]>*/
</script>

</body>
</html>
