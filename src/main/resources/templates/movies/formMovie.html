<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Film - FestivalProf</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: #111827; font-weight: 800;"
            th:text="${film.id != null ? '✏️ Modifica Film' : '➕ Inserisci Nuovo Film'}">
            Nuovo Film
        </h2>

        <form th:action="${film.id != null} ? @{/admin/movies/{id}/edit(id=${film.id})} : @{/admin/movies/new}" method="POST">
            <div class="form-group">
                <label for="titolo">Titolo Film</label>
                <input type="text" id="titolo" th:field="${film.titolo}" class="form-control" placeholder="Es. Oppenheimer">
                <div class="error-msg" th:if="${#fields.hasErrors('film.titolo')}" th:errors="${film.titolo}"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label for="anno">Anno Produzione</label>
                    <input type="number" id="anno" th:field="${film.anno}" class="form-control" placeholder="2023">
                    <div class="error-msg" th:if="${#fields.hasErrors('film.anno')}" th:errors="${film.anno}"></div>
                </div>

                <div class="form-group">
                    <label for="durata">Durata (minuti)</label>
                    <input type="number" id="durata" th:field="${film.durata}" class="form-control" placeholder="180">
                    <div class="error-msg" th:if="${#fields.hasErrors('film.durata')}" th:errors="${film.durata}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="genere">Genere</label>
                <input type="text" id="genere" th:field="${film.genere}" class="form-control" placeholder="Es. Biografico / Drammatico">
                <div class="error-msg" th:if="${#fields.hasErrors('film.genere')}" th:errors="${film.genere}"></div>
            </div>

            <div class="form-group">
                <label for="paeseProduzione">Paese di Produzione</label>
                <input type="text" id="paeseProduzione" th:field="${film.paeseProduzione}" class="form-control" placeholder="Es. Stati Uniti">
                <div class="error-msg" th:if="${#fields.hasErrors('film.paeseProduzione')}" th:errors="${film.paeseProduzione}"></div>
            </div>

            <div class="form-group">
                <label for="registaId">Regista</label>
                <select id="registaId" name="registaId" class="form-control">
                    <option value="">-- Seleziona Regista --</option>
                    <option th:each="r : ${registi}" 
                            th:value="${r.id}" 
                            th:selected="${film.regista != null and film.regista.id == r.id}"
                            th:text="${r.nomeCompleto + ' (' + r.nazionalita + ')'}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">Salva Film</button>
        </form>
    </div>
</div>

</body>
</html>
